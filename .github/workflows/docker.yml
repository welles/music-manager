name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test MusicManager.slnx --configuration Release

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Commit time
        id: commit
        run: echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version != '' && startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '0.0.0' }}
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ steps.commit.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the image of a push to main is published: the owner's NixOS
  # configuration (welles/nixos-config) sets the music_manager stack to
  # ghcr.io/welles/music-manager:sha-<this commit> (its workflow
  # update-music-manager.yml), so the next deploy brings this version. Needs the
  # secret NIXOS_CONFIG_DISPATCH_TOKEN: a fine-grained token for
  # welles/nixos-config only, with "Actions: read and write" (starting a
  # workflow; it cannot change code). Skipped without it.
  update-nixos-config:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DISPATCH_TOKEN: ${{ secrets.NIXOS_CONFIG_DISPATCH_TOKEN }}
    steps:
      - name: Start the image update in welles/nixos-config
        if: env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}
          REV: ${{ github.sha }}
        run: |
          gh workflow run update-music-manager.yml \
            --repo welles/nixos-config --ref main -f rev="$REV"

      - name: Skipped (no token)
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::NIXOS_CONFIG_DISPATCH_TOKEN is not set; welles/nixos-config is not asked to update."
